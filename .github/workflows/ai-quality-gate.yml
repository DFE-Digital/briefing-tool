# The Responsible AI quality gate: runs the briefing agent's test cases in Foundry and decides whether it can be
# released. A deployment workflow calls this one and depends on it, so a blocked release never deploys:
#
#   jobs:
#     quality-gate:
#       uses: ./.github/workflows/ai-quality-gate.yml
#       secrets: inherit
#     deploy:
#       needs: quality-gate
#
# Exit codes: 0 release permitted, 1 release blocked, 2 the gate couldn't run. Any but 0 fails the job.
name: AI quality gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/Dfe.Briefing.Tool.Web/Prompts/**"
      - "src/Dfe.Briefing.Tool.Application/**"
      - "src/Dfe.Briefing.Tool.Infrastructure/**"
      - "src/Dfe.Briefing.Tool.ReleaseGate/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One gate at a time per branch: each run creates temporary agents and uses the model's quota.
concurrency:
  group: ai-quality-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Responsible AI quality gate
    runs-on: ubuntu-latest
    # Holds the Foundry, search and guardrail secrets, and can require a reviewer before the gate spends tokens.
    environment: ai-evaluation
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/Dfe.Briefing.Tool.ReleaseGate
    env:
      DOTNET_NOLOGO: true
      # The manifest must record the commit tested.
      AiAgents__Evaluation__QualityGate__RequireSourceRevision: "true"
      AiAgents__Foundry__Endpoint: ${{ secrets.AI_FOUNDRY_ENDPOINT }}
      AiAgents__Foundry__DefaultModel: ${{ vars.AI_FOUNDRY_DEFAULT_MODEL }}
      AiAgents__Authentication__TenantId: ${{ secrets.AZURE_TENANT_ID }}
      AiAgents__Authentication__ClientId: ${{ secrets.AZURE_CLIENT_ID }}
      AiAgents__Authentication__ClientSecret: ${{ secrets.AZURE_CLIENT_SECRET }}
      AiAgents__AISearch__Endpoint: ${{ secrets.AI_SEARCH_ENDPOINT }}
      AiAgents__AISearch__Authentication__TenantId: ${{ secrets.AZURE_TENANT_ID }}
      AiAgents__AISearch__Authentication__ClientId: ${{ secrets.AZURE_CLIENT_ID }}
      AiAgents__AISearch__Authentication__ClientSecret: ${{ secrets.AZURE_CLIENT_SECRET }}
      AiAgents__Guardrails__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AiAgents__Guardrails__ResourceGroup: ${{ vars.AI_GUARDRAILS_RESOURCE_GROUP }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add the DfE package feed
        run: >
          dotnet nuget add source https://nuget.pkg.github.com/DFE-Digital/index.json --name DfE
          --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      # Cheap checks first: a test case that breaks the conventions fails here, before any model call.
      - name: Unit tests, test case conventions included
        working-directory: src
        run: dotnet test Dfe.Briefing.Tool.slnx -c Release

      - name: Run the quality gate
        run: dotnet run -c Release --no-launch-profile -- gate

      # Kept whatever the decision, so failures, warnings and accepted risks stay auditable.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/Dfe.Briefing.Tool.ReleaseGate/evaluation-reports/
          if-no-files-found: warn
          retention-days: 400
