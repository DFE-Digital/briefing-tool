name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    # Only the root's Markdown: the agents' prompts are Markdown too, and a change to one must build and test.
    paths-ignore:
      - '*.md'

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  SOLUTION: src/Dfe.Briefing.Tool.slnx

# Sonar analysis is in sonarcloud.yml.
jobs:
  build:
    name: Build .NET and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Add nuget package source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget add source --username USERNAME --password $GH_TOKEN --store-password-in-clear-text --name github "https://nuget.pkg.github.com/DFE-Digital/index.json"

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

    - name: Test
      run: dotnet test --solution ${{ env.SOLUTION }} --no-build -c Release
