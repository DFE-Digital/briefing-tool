name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '*.md'

permissions:
  contents: read
  packages: read
  pull-requests: read

# A newer commit to the same PR or branch replaces an analysis still running.
concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  SOLUTION: src/Dfe.Briefing.Tool.slnx

jobs:
  analyse:
    name: SonarCloud analysis
    if: vars.SONAR_CI_ANALYSIS == 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'DFE-Digital_briefing-tool' }}
    steps:
    - name: Check the Sonar token is set
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo "::error::The SONAR_TOKEN repository secret is missing or empty."
          exit 1
        fi

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0 # Full history, so SonarCloud can tell which code is new

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'microsoft'

    - name: Cache SonarCloud packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.sonar
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install SonarCloud scanner and report generator
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Add nuget package source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget add source --username USERNAME --password $GH_TOKEN --store-password-in-clear-text --name github "https://nuget.pkg.github.com/DFE-Digital/index.json"

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}

    # qualitygate.wait: the end step waits for SonarCloud's quality gate and fails the job if the new code fails it.
    - name: Begin Sonar analysis
      run: dotnet-sonarscanner begin /d:sonar.token=$SONAR_TOKEN /o:dfe-digital /k:$SONAR_PROJECT_KEY /d:sonar.coverageReportPaths=./CoverageReport/SonarQube.xml /d:sonar.qualitygate.wait=true

    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

    # The tests run on Microsoft Testing Platform (global.json), so coverage comes from its own --coverage option. Each
    # test project writes its own uniquely named .cobertura.xml: a fixed --coverage-output name would overwrite the first.
    - name: Test with coverage
      run: dotnet test --solution ${{ env.SOLUTION }} --no-build -c Release --coverage --coverage-output-format cobertura

    # Source generators ([GeneratedRegex], logging) add code that is compiled from memory, never written to disk, so
    # Sonar fails on its coverage ("File ... RegexGenerator.g.cs does not exist"): it's left out of the report.
    - name: End Sonar analysis
      run: |
        reportgenerator -reports:"**/TestResults/*.cobertura.xml" -targetdir:./CoverageReport -reporttypes:SonarQube "-filefilters:-*.g.cs;-*/obj/*"
        dotnet-sonarscanner end /d:sonar.token=$SONAR_TOKEN
